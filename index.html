<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ME研究室マッチング</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ME研究室マッチングシステム</h1>
        
        <p>Ｂ４の先輩たちのデータをもとに，あなたの研究室選びをサポートします．</p>
        
        <p style="background-color: #fff3cd; padding: 10px; border-radius: 5px; font-size: 0.9em;">
            ⚠️ <strong>注意事項（非公式ツールです）</strong><br>
            本サイトの情報はあくまで参考目安です．情報を鵜呑みにせず，最終的な詳細は必ず各研究室の公式ホームページや見学等で確認してください．
        </p>
        
        <p style="background-color: #e2e3e5; padding: 10px; border-radius: 5px; font-size: 0.9em; margin-bottom: 25px;">
            💡 <strong>キーワード選びのコツ</strong><br>
            専門的な単語も多数含まれています．見慣れない単語がある場合は無理に選ばず，まずは直感的に気になる「主要キーワード」を中心にチェックしてみてください．
        </p>
        
        <hr>
        
        <div id="keywords-container">
            <!-- ここにJavaScriptでキーワードのチェックボックスが自動生成されます -->
        </div>

        <button id="diagnose-btn">診断する</button>
        
        <div id="results-container">
            <!-- ここに診断結果が表示されます -->
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
