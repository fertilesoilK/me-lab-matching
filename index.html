<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ME研究室マッチング</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ME研究室マッチングシステム</h1>
        <p>Ｂ４の先輩たちのデータをもとに，あなたの研究室選びをサポートします．非公式なサイトのため，情報を鵜呑みにしないようにしましょう．詳細は各研究室に問い合わせることをおすすめします．</p>
        <hr>
        
        <div id="keywords-container">
            <!-- ここにJavaScriptでキーワードのチェックボックスが自動生成されます -->
        </div>

        <button id="diagnose-btn">診断する</button>
        
        <div id="results-container">
            <!-- ここに診断結果が表示されます -->
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
